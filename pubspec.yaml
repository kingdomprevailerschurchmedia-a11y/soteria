name: soteria
description: "Soteria - Competitive Learning Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.3.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.2.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  intl: 0.20.2
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.0.0
  logger: ^2.7.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  mockito: ^5.6.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/
    - assets/json/

    - .env.dev
    - .env.prod