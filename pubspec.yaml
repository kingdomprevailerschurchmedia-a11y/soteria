name: soteria
description: "Soteria - Competitive Learning Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  go_router: ^14.8.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.2.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  intl: 0.20.2
  shared_preferences: ^2.3.5
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  logger: ^2.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2

dependency_overrides:
  riverpod: 3.3.2
  riverpod_annotation: 4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: 4.0.4
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/
    - assets/json/

    - .env.dev
    - .env.prod